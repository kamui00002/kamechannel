reviewed: false
note: |
  このコマンドで面白いのは、やっていることより **やらないと決めていること** です。

  名前だけ見ると「なんでも HTML にするコマンド」に見えますが、下敷きになっている規約は
  逆で、既定は Markdown です。Discord の返信もターミナルの出力も Obsidian のノートも、
  そこは Markdown が正しい。HTML を選ぶのは「出力先がブラウザで開かれる前提か」が
  Yes で、かつ severity の色分け・図・ジャンプリンクのどれかが実際に効くときだけ、
  という判定になっています。Discord の返信に HTML タグを返せば生タグが見えるだけで、
  リッチにはなりません。その事故を止めるために、判定を先に置いてある。

  もう一つ効いているのが「自己完結（外部ライブラリ禁止・style 内蔵）」という縛りです。
  CDN に依存した解説ページは、オフラインや社内環境で開いた瞬間に崩れます。生成物が
  一枚のファイルで完結していれば、どこへ持って行っても同じものが出る。ダークモード対応が
  必須要素に入っているのも同じ理由で、読む側の環境をこちらが選べないからです。

  道具そのものより、**いつ使わないかを先に書いた**のが、この一枚の値打ちだと思っています。
