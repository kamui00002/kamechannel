      起動した時点で拾うのは、始めた場所そのものと、そこから上だけです。そこより下の
      フォルダ（子）と、横に並ぶフォルダ（兄弟）は来ません。ただし子のほうは、あとで
      そのフォルダの中身を触ったときに来ます。ホームの .claude に置いたものだけは、
      どこで起動しても読まれます。色は 3 つで、緑が起動した時点で来るもの、青が
