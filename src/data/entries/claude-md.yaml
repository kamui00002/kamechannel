slug: claude-md
sourceId: claude-md
title: どの CLAUDE.md が読まれるの？
publishedAt: '2026-09-09'
# reviewed: false = 註がまだ運営者の手で確認されていない。
# 中身は運営者の質問（2026-09-07）と、捨てフォルダに合言葉を仕込んだ実測（2026-09-09）から。
# 実測条件: claude 2.1.266 / --strict-mcp-config / ~/ブログ関係/kamechannel-work/md-test 配下。
# ⚠ 「見えない」と書いた 3 ファイルは、いずれも実在を確かめたうえでの「見えない」です。
# reviewed: true は運営者だけが立てる。
reviewed: false

figures:
  - after: 4
    kind: md-tree
    caption: >-
      削って残った一文を絵にしたもの。起動したフォルダから上へ上へと探しにいきます。
      下（子）と横（兄弟）は見にいきません。ホームの .claude に置いたものだけは、どこで起動しても
      読まれます。
  - after: 6
    kind: aikotoba
    caption: >-
      6 か所に合言葉を隠して、子フォルダで起動して聞いた結果。
      緑が届いたもの、赤が届かなかったもの。ALPHA と ECHO が緑なのが大事で、
      これがあるから赤の 3 つを「届かなかった」と言い切れます。
  - after: 8
    kind: atmark
    caption: >-
      同じ 1 行の「@」なのに、書いてある場所で結果が変わりました。
      起動したフォルダの CLAUDE.md なら開きます。上に遡って読まれた
      CLAUDE.md では開きませんでした。

note: |
  「md がたくさんあるけど、どこのが反映されるの？」

  これ、私が実際に聞いた質問です。手元には
  {{`CLAUDE.md`|そのフォルダの「決まりごとを書いた紙」です。Claude Code は仕事を始めるとき、まずこれを読みます。「日本語で答えて」「main に直接コミットしない」みたいに、毎回口で言うのが面倒なことを書いておくと、こちらが黙っていても守ってくれます。逆に、ここに書いていないことは毎回言うしかありません。だから書き足していく価値があるんです。}}
  が 5 つありました。ホームに 1 つ、`~/.claude` に 1 つ、ブログのリポジトリごとに
  1 つずつ。全部が読まれているのか、どれか 1 つだけなのか、それとも近い順に
  上書きされるのか。まったく分かりませんでした。

  最初、AI はこう答えてくれました。「{{起動したフォルダ|ターミナルで claude と打った、そのときいる場所のことです。cd で移動してから起動すれば、移動先が起動したフォルダになります。「どのフォルダで始めたか」だけで読まれる決まりが変わるので、同じパソコンの同じ設定でも、始める場所を変えると Claude の振る舞いが変わります。ここが分かっていないと「昨日と言うことが違う」の理由が一生わかりません。}}から親をたどって探しにいきます。
  `@` で書いた行はそのファイルの中身に置き換わります。見つかったものは打ち消し合わずに
  全部重なって効きます」。……全然わかりませんでした！ 3 つのことを一度に言われて、
  どれが土台でどれがおまけなのか、区別がつかなかったんです。悪いのは私の頭ではなくて、
  たぶん一度に渡された量のほうでした。

  そこで「いちばん大事な一文だけにして」とお願いしました。返ってきたのがこれです。
  **「起動したフォルダのやつ」**。
  一文なら分かりました。そして絵にしたら、もっと分かりました。

  ただ、「分かったつもり」と「分かった」は別ものです。せっかくなので確かめました。
  やり方はすごく単純で、**捨てていいフォルダを作って、そこら中に合言葉を隠す**だけです。
  親フォルダに ALPHA、子フォルダに CHARLIE、隣の兄弟フォルダに DELTA。
  さらに、親と子それぞれの CLAUDE.md から
  {{`@`|「この行を、別のファイルの中身と差し替えて」という書き方です。「@rules/workflow.md」と 1 行書いておくと、その場所にそのファイルの中身がまるごと入ってきます。長い決まりを 1 枚に全部書くと読みにくいので、話題ごとに分けて「@」でつなぐ、という使い方をします。ちなみに、この書き方はチャットの中で「このファイル見て」と渡すときにも使いますが、それとは別の話です。}}
  で別ファイルを呼んで、そこに BRAVO と ECHO と FOXTROT。全部で 6 か所です。
  そして子フォルダで Claude Code を起動して、こう聞きました。
  「ファイルは一切読まないで。最初から渡されている分だけ見て、どの合言葉が見える？」

  見えたのは ALPHA・CHARLIE・ECHO の 3 つ。見えなかったのは BRAVO・DELTA・FOXTROT の
  3 つでした。ここで大事なのは、**見えなかった 3 つのファイルが、どれも実在していた**
  ことです。消し忘れでも打ち間違いでもありません。あと、ALPHA と ECHO が見えたことが
  効いています。ALPHA が見えるから「親のファイルは読まれている」と言えるし、ECHO が
  見えるから「`@` の仕組み自体は動いている」と言えます。この 2 つが
  {{陽性対照|「ちゃんと鳴るはずのものが、ちゃんと鳴るか」を先に確かめておくことです。火災報知器を点検するとき、鳴らないのを見て「異常なし」と言ったら困りますよね。まず煙を当てて鳴ることを確かめて、それから「今は鳴っていない＝火事ではない」と言える。検査が緑でも、それが「安全」なのか「そもそも測っていない」のかは、先に赤を出してみないと区別がつきません。}}
  です。これが無いと、「見えない」は「読まれていない」なのか「そもそも実験が失敗して
  いる」なのか、区別がつきませんでした。

  で、1 つだけ、思っていたのと違うものがありました。**BRAVO と FOXTROT です。**
  どちらも親の CLAUDE.md から `@` で呼んだファイルなのに、届いていませんでした。
  子の CLAUDE.md から呼んだ ECHO は届いているのに、です。私は最初「BRAVO は
  `@./yonda.md` と書いたから、この `./` が起動したフォルダのほうを指してしまって、
  行き先を見失ったんだ」と考えました。それらしい理屈でした。

  そこで、まったく同じ場所を
  {{絶対パス|「/Users/…」から始まる、途中の道順を全部書いた住所のことです。どこから見ても同じ場所を指します。反対が相対パス（「./yonda.md」など）で、こちらは「今いる場所から見て」の住所なので、今いる場所が変わると指す先も変わります。迷子になりやすいのはいつも相対パスのほうです。}}
  で書き直して、もう一度聞きました。**外れました。** 絶対パスでも FOXTROT は
  届きませんでした。つまり道順の書き方の問題ではなくて、`@` の行は
  **上に遡って読まれた CLAUDE.md では開かれません**、ということみたいです。同じ一行なのに、
  書いてある場所で結果が変わりました。

  これ、他人事じゃありませんでした。私のホームの CLAUDE.md にも
  `@~/.claude/build-commands.md`（ビルドコマンドの一覧）という行があります。
  ブログのフォルダで起動すると、ホームの CLAUDE.md は「親」として読まれる側になります。
  ということは、そのあいだ、あの一覧は届いていません。実際、今回の実験でも届いて
  いませんでした。862 バイトのファイルが、ちゃんと置いてあるのに素通りです。
  ちょっと切ないですね。ただし、ホームそのもので起動したときは届きます。
  そのときホームの CLAUDE.md は「親」ではなく「起動したフォルダ」のほうだからです。
  いつでも読まれない、という話ではありませんでした。

  というわけで、今日わかったことは 4 つです。**起動したフォルダのものは読まれる。
  親をたどって上のものも読まれる。子と兄弟は読まれない。ホームの .claude に
  置いたものは、どこで起動しても読まれる。** そして、`@` を書くなら起動するフォルダの
  CLAUDE.md に書いたほうがよさそうです。……ただ、これは 2026-09-09 に
  claude 2.1.266 で測った結果です。仕様として公表されているものを読んだわけでは
  ないので、版が変わったら変わるかもしれません。そのときはまた測ります。
