  - after: 6
    kind: namae
    caption: >-
      仮想のフォルダ myapp の中身。色は 3 つで、緑が何もしなくても読まれるもの、
      青が「呼べば来る」もの、赤が来ないものです。このフォルダで
      勝手に読まれるのは CLAUDE.md だけで、あとはアットマークで呼ばれたときだけ来ます。CLAUDE-mobile.md は惜しいけれど、ぴったり同じではありません。
  - after: 9
    kind: atmark
    caption: >-
      同じ 1 行のアットマークなのに、書いてある場所で結果が変わりました。
