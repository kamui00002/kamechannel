slug: claude-md
sourceId: claude-md
title: どの CLAUDE.md が読まれるの？
publishedAt: '2026-09-09'
# reviewed: false = 註がまだ運営者の手で確認されていない。
# 中身は運営者の質問（2026-09-07）と、捨てフォルダに合言葉を仕込んだ実測（2026-09-09）から。
# 実測条件: claude 2.1.266 / --strict-mcp-config / ~/ブログ関係/kamechannel-work/md-test 配下。
# 公式突き合わせ: 2026-09-10 に code.claude.com/docs/ja/memory（日本語版）を参照。
# 引用は節「CLAUDE.md ファイルの読み込み方法」「追加ファイルをインポートする」から原文どおり。
# ⚠ 「見えない」と書いた 3 ファイルは、いずれも実在を確かめたうえでの「見えない」です。
# ⚠ 合言葉は記号名（ALPHA 等）で呼ばない。隠した「場所」の名前で呼ぶこと（図も同じ）。
# reviewed: true は運営者だけが立てる。
reviewed: true

