      CLAUDE.md では開きませんでした。
  - after: 15
    kind: hyoshiki
    caption: >-
      同じ「決まりごと」でも、標識と遮断機は別ものです。標識は運転手が読んで守るもの。
      遮断機は装置が勝手に降りるもの。だから遮断機は、線路がある場所にしか作れません。

note: |
  「md がたくさんあるけど、どこのが反映されるの？」

  これ、私が実際に聞いた質問です。手元には
  {{`CLAUDE.md`|そのフォルダの「決まりごとを書いた紙」です。Claude Code は仕事を始めるとき、まずこれを読みます。「日本語で答えて」「main に直接コミットしない」みたいに、毎回口で言うのが面倒なことを書いておくと、こちらが黙っていても、だいたい守ってくれます。逆に、ここに書いていないことは毎回言うしかありません。だから書き足していく価値があるんです。}}
  が 5 つありました。ホームに 1 つ、`~/.claude` に 1 つ、ブログのリポジトリごとに
  1 つずつ。全部が読まれているのか、どれか 1 つだけなのか、それとも近い順に
  上書きされるのか。まったく分かりませんでした。

  答えは **全部読まれる** でした。どれか 1 つが勝ち残るのではありません。
  {{起動したフォルダ|ターミナルで claude と打った、そのときいる場所のことです。cd で移動してから起動すれば、移動先が起動したフォルダになります。「どのフォルダで始めたか」だけで読まれる紙が変わるので、同じパソコンの同じ設定でも、始める場所を変えると Claude の振る舞いが変わります。ここが分かっていないと「昨日と言うことが違う」の理由が一生分かりません。}}
  から**上へ上へとたどって**、途中にある `CLAUDE.md` を拾えるだけ拾います。5 つあれば 5 つとも効きます。拾うのは、始めた場所そのものと、そこから上だけ。
  **そこより下のフォルダと、横に並ぶフォルダは、起動した時点では来ません。**
  （下にあるものだけは、あとでそのフォルダの中身を触ったときに来ます）。
  それともう 1 つ、`~/.claude/CLAUDE.md` だけは
  別枠で、どこで起動しても必ず読まれます。

  話を進める前に、知っておいたほうがいい仕組みがあります。{{`@`|「この行を、別のファイルの中身と差し替えて」という書き方です。「@rules/style.md」と 1 行書いておくと、その場所にそのファイルの中身がまるごと入ってきます。長い決まりごとを 1 枚に全部書くと読みにくいので、話題ごとに分けて「@」でつなぐ、という使い方をします。なお、この書き方はチャットの中で「このファイル見て」と渡すときにも使いますが、それとは別の話です。}}
  です。`@` は **「別の紙をここに貼り込め」の合図**。`CLAUDE.md` が長くなってきたら、
  中身を話題ごとに別のファイルへ切り出して、元の紙には `@` の 1 行だけを残します。
  読まれるときには元どおり 1 枚につながって見えます。切り出した先への**道を作る**、
  という感じです。ちなみに公式のドキュメントでは、この仕組みを**「インポート」**、
  この書き方を「`@` 構文」と呼んでいます。

  仮想のフォルダで例えます。`myapp` というフォルダに `CLAUDE.md` を 1 枚置きました。
  長くなってきたので、書き方の決まりを `rules/style.md` へ、秘密の鍵の扱いを
  `rules/secrets.md` へ切り出して、元の `CLAUDE.md` には `@rules/style.md` と
  1 行だけ書いておきます。それと、スマホ用の決まりごとだけ分けておきたくて
  `CLAUDE-mobile.md` も置きました。……さて、このフォルダで Claude Code を
  起動したとき、何もしなくても読まれるのはどれでしょう。

  答えは `CLAUDE.md` **だけ**です。**このフォルダで、何も言わなくても勝手に読まれるのは
  CLAUDE.md だけ。** ほかのファイルは、`@` で呼ばれたときだけ
  来ます。だから `rules/style.md` は呼んだので来ますが、`rules/secrets.md` は
  呼んでいないので来ません。そしてここが少し意地悪で、`CLAUDE-mobile.md` も
  読まれません。名前が `CLAUDE` で始まっていても、**それだけでは駄目**
  なんです。惜しい名前でも来ません。ただ、これは困りごとではなく、むしろ
  狙いどおりです。スマホ用の決まりごとを、パソコン用の作業中に読まれても邪魔なだけですから。

  とはいえ、上へたどって拾うのも、`@` で呼ぶのも、ここまでは「そう聞いた」だけです。「分かったつもり」と「分かった」は
  別ものなので確かめました。やり方はすごく単純で、**捨てていいフォルダを作って、
  そこら中に合言葉を隠す**だけです。お店で言えば、入口とレジと倉庫と隣の店に
  貼り紙をしておいて、レジに立った店員に「どの貼り紙が見えてる？」と聞くようなこと
  です。隠したのは 6 か所。まず `CLAUDE.md` の本文そのものに 3 つ。起動したフォルダ、
  その親フォルダ、隣に並ぶ兄弟フォルダの 3 枚です。残りの 3 つは `@` の先に置きました。
  起動したフォルダの `CLAUDE.md` に `@./yonda.md` と 1 行書いて、その `yonda.md` の
  中に合言葉を 1 つ。親フォルダの `CLAUDE.md` にも同じく `@./yonda.md` と書いて、
  その先に 1 つ。最後の 1 つは、親の `CLAUDE.md` に**あとから**足した
  行の先です（なぜ足したかは、少しあとで話します）。そして子フォルダで Claude Code を起動して、こう聞きました。
  「ファイルは一切読まないで。最初から渡されている分だけ見て、どの合言葉が見える？」

  見えたのは 3 つでした。**起動したフォルダの本文。そこからアットマークで
  呼んだ先。そして親フォルダの本文。** 見えなかったのも 3 つで、隣の兄弟フォルダの
  本文と、親フォルダから `@` で呼んだ先が 2 本です。ここで大事なのは、**見えなかった
  3 つのファイルが、どれも実在していた**ことです。消し忘れでも打ち間違いでもありません。
  それと、見えた側に「親フォルダの本文」と「`@` で呼んだ先」が 1 つずつ入っているのが
  効いています。親が見えるから「上のほうはちゃんと読まれている」と言えるし、`@` の先が
  見えるから「`@` の仕組み自体は動いている」と言えます。この 2 つが
  {{陽性対照|「ちゃんと鳴るはずのものが、ちゃんと鳴るか」を先に確かめておくことです。火災報知器を点検するとき、鳴らないのを見て「異常なし」と言ったら困りますよね。まず煙を当てて鳴ることを確かめて、それから「今は鳴っていない＝火事ではない」と言えます。検査が緑でも、それが「安全」なのか「そもそも測っていない」のかは、先に赤を出してみないと区別がつきません。}}
  です。これが無いと、「見えない」は「読まれていない」なのか「そもそも実験が失敗して
  いる」なのか、区別がつきませんでした。

  で、思っていたのと違ったのが 1 つだけありました。**親フォルダから呼んだ先だけが
  届かない。** 起動したフォルダから呼んだ先は届いているのに、です。私は最初
  「`@./yonda.md` と相対パスで書いたから、この `./` が起動したフォルダのほうを
  指してしまって行き先を見失ったんだ」と考えました。それらしい理屈でした。
  そこで、親の `CLAUDE.md` に、今度は
  {{絶対パス|「/Users/…」から始まる、途中の道順を全部書いた住所のことです。どこから見ても同じ場所を指します。反対が相対パス（「./yonda.md」など）で、こちらは「今いる場所から見て」の住所なので、今いる場所が変わると指す先も変わります。迷子になりやすいのはいつも相対パスのほうです。}}
  で書いた行を足して、もう一度聞きました。**外れました。** 絶対パスでも届きません。
  つまり道順の書き方の問題ではありませんでした。`@` は気まぐれで動いたり動かなかったり
  するのではなく、**効く場所が決まっている**だけです。`~/.claude/CLAUDE.md` と、
  起動したフォルダの `CLAUDE.md`。この 2 枚に書いた `@` は毎回開きます。
  上へたどって拾われた紙に書いた `@` は開きません。

  これ、他人事じゃありませんでした。私もビルドコマンドの一覧を別ファイルに切り出して、
  ホームの `CLAUDE.md` から `@` で呼んでいたからです。ブログのフォルダで起動すると、
  ホームの `CLAUDE.md` は「上へたどって拾われる側」になります。ということは、そのあいだ、
  あの一覧は届いていません。実際、今回の実験でも素通りでした。ちゃんと置いてあるのに、
  です。ちょっと切ないですね。ただし、ホームそのもので起動したときは届きます。
  そのときホームの `CLAUDE.md` は「起動したフォルダの紙」のほうだからです。
  覚えることは 1 行だけです。アットマークの行は、**上へたどって拾われるほうの紙には
  書かない。**

  というわけで、`CLAUDE.md` については 4 つでした。**起動したフォルダのものは読まれる。
  上へたどって親のものも読まれる。子と兄弟は、起動した時点では来ない（子だけは、あとで
  そのフォルダの中身を触ったときに来る）。ホームの .claude に置いたものは、
  どこで起動しても読まれる。** ……と、ここまでが 2026-09-09 に claude 2.1.266 で
  自分で測った結果です。

  そのあと、**公式のドキュメントを読んで突き合わせました**（日本語版の「CLAUDE.md
  ファイルの読み込み方法」という節です）。結果、測って分かったことのほとんどは、
  そのまま合っていました。「全部読まれる」「上へたどる」「ホームの `.claude` は別枠」
  の 3 つは、公式にも同じことが書いてあります。ただし 1 つだけ、**私の言い方が
  行き過ぎていました。** 子フォルダについて、公式にはこうあります。「起動時に
  読み込む代わりに、Claude がそれらのサブディレクトリ内のファイルを読むときに
  含まれます」。
  つまり子は「来ない」のではなく「**最初は来ない**」。お店で言えば、入口の貼り紙は
  入った瞬間に目に入るけれど、奥の棚の貼り紙は、その棚の前まで行って初めて目に入ります。
  貼っていないわけではありません。私が聞いたのは「**いま何が来ているか**」だけ
  だったので、そもそも測っていない範囲を言い切っていたわけです。上のまとめで
  「起動した時点では来ない」と書いたのは、そのためです。なお、兄弟（横に並ぶフォルダ）に
  ついては、公式には何も書かれていませんでした。ここは**実測で来なかった、というだけ**です。

  それと、試していなかった話のほうにも、公式を読んで見つかった言い過ぎがありました。
  **何も言わなくても読まれるのは、CLAUDE.md だけではありませんでした。** 自分だけの
  決まりごとを書く `CLAUDE.local.md` と、`.claude/rules/` というフォルダに置いた
  ファイルも、勝手に読まれると書いてあります（myapp の `rules/` は、頭に `.claude/` が
  付いていないので別物です）。上の myapp の話を「このフォルダで」と絞って書いたのは、
  そのためです。この 2 つは、まだ試していません。

  そしてもう 1 つ、**公式と食い違ったままのものがあります。**`@` の件です。公式の
  「追加ファイルをインポートする」という節には「インポートされたファイルは展開され、
  それらを参照する `CLAUDE.md` と一緒に起動時にコンテキストに読み込まれます」と
  だけ書いてあって、**上へたどって拾われた紙では開かない、とは
  書かれていません。** でも手元では、道順を短く書いても全部書いても届きませんでした。
  どちらが正しいのかは、私には決められません。決められるのは「**手元ではこうだった**」
  までです。版が変わったら、また測ります。

  最後に 1 つだけ。ここまでの話は全部、**「お願い」**の話でした。`CLAUDE.md` に
  「main に直接コミットしない」と書くのは、標識を立てるのと同じです。読んでくれるし、
  守ろうともしてくれます。でも、守らなかったときに止めてくれるものではありません。
  止めるほうの仕組みは別にあって、{{Hooks|Claude Code に仕込んでおく小さなプログラムです。「ファイルを書く直前」「返事を終えた直後」といった決まった場面で、こちらが黙っていても必ず走ります。中で「この操作は許さない」と返せば、その操作は本当に止まります。CLAUDE.md が読んでもらう文章なのに対して、こちらは実行される仕掛けです。そのぶん、1 つ増やすたびにプログラムを 1 本書くことになります。}}
  といいます。違いは、道路の標識と、踏切の遮断機です。

  この図だけ見ると「じゃあ全部を遮断機にすればいいのでは」と思うのですが、そうは
  いきません。機械が判定できるのは**形**だけだからです。「秘密の鍵らしき文字列が
  混じっている」は形なので止められます。でも「今のタスクと無関係な箇所は触らない」
  「一度に詰め込まないで、1 メッセージ 1 論点で」は形になりません。何が無関係かは
  中身を読まないと決まらないし、「詰め込みすぎ」に境界線は引けないからです。こういう
  ものは標識にしか書けません。それに標識は、気まぐれに無視されるわけでもなくて、
  **だいたい守られます。** だから使い分けはこうなりました。「だいたい」で困らない
  ことは標識に書く。一度でも起きたら事故になることだけ遮断機にする。**標識は読んで
  ほしいこと、遮断機は絶対に通してはいけないところ。** 遮断機が踏切にしかないのと
  同じで、遮断機のほうは数を絞るものみたいです。
