slug: empirical-prompt-tuning
sourceId: empirical-prompt-tuning
title: empirical-prompt-tuning — 自分の書いた指示は自分では読めない
publishedAt: '2026-09-06'
reviewed: false
note: |
  この skill の前提は身も蓋もなくて、**プロンプトの品質は書いた本人には分からない**、です。
  自分で読み返しても、書いたときの意図が勝手に補完されるので、曖昧な箇所が曖昧に見えない。
  だから白紙のサブエージェントに実際に動かしてもらい、詰まった箇所を自己申告させる、
  という形をとっています。自己再読で済ませないことが明示的に禁じられているのが要点です。

  よくできていると思ったのが、本番の評価より前に置かれた Iteration 0 です。frontmatter の
  description が謳う用途と、本文がカバーしている範囲が食い違っていないかを先に見る。
  ここを飛ばすと、サブエージェントは description に合わせて本文を **再解釈** してしまい、
  実際には要件を満たしていないのに精度だけ出てしまう。緑が「良い」ではなく「測れていない」を
  意味してしまう状態で、これは検証全般に共通する落とし穴です。

  もう一つは `tool_uses` の読み方。精度だけ見ていると構造的な欠陥が隠れるので、シナリオ間の
  相対値として見る。あるシナリオだけ他の 3〜5 倍のツール呼び出しになっていたら、それは
  そのシナリオ用の手順が skill の中に無く、参照ファイルを横断探索させられているサインだ、
  という読み方です。精度 100% でも偏りがあれば次のイテレーションを回す根拠になる。
  **数字が良いことと、仕組みが正しいことは別**という、同じ話がここでも出てきます。
