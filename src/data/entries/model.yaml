title: /model — 切り替えたら、どこまで変わるの？
publishedAt: '2026-09-16'
# reviewed: false = 註がまだ運営者の手で確認されていない。
# 中身は運営者の 4 つの質問（2026-09-16）と、その日の実測から起こしたもの。
# 実測条件: claude 2.1.266 / 合言葉テストは運営者がターミナルで実行 /
# モデル名は会話記録（~/.claude/projects の assistant 行の model）で確認。
# 「使い分け」の節だけは実測ではなく判断。値段は bundled skill claude-api の表。
# reviewed: true は運営者だけが立てる。
reviewed: false

# 図。どこに・どの図を・どういう説明で、の 3 つだけを持つ（絵は src/components/Figure.astro）。
# ⚠ after は註の段落番号（1 始まり）。段落を足し引きしたらここも数え直すこと。
#    2 ＝「なので、合言葉を隠して試しました」／ 5 ＝「試している途中で〜」／
#    6 ＝「もう 1 つ気になっていたのが」。ビルドは範囲内なら通ってしまうので、
#    dist を文書順に歩いて図の前後の段落を目で確かめること。
figures:
  - after: 2
    kind: model-aikotoba
    caption: >-
      「/model」を打った前後の 53 秒です。左が時刻で、右が返事を書いた側の名札。まん中の
      青い帯が会話の記録で、上から下まで 1 本のまま切れていません。代わったのは右の名札だけで、
      Sonnet 5 から Opus 5 になっています。最後の緑は、前半で伝えた合言葉が後半に届いた印です。
      下は対照で、何も教えていない別の会話に同じことを聞くと「知らない」と返ってきます。
      当てずっぽうでは当たらない、ということの確かめです。

  - after: 5
    kind: model-default
    caption: >-
      「/model」を打ったあとに、何がどこまで確かめられたか。上は設定ファイルで、既定が
      fable（赤＝消えた）から opus（緑＝入った）へ変わり、更新時刻も新しくなっていました。
      ここは実物を開いて見ています。下は、そのあと開いた会話です。ターミナルからは既定どおり
      Opus 5 で始まりましたが 1 例だけ、デスクトップからは設定と違うモデルで始まりました。
      一番下の 1 行だけ枠が無いのは、緑でも赤でもないからです。起動のときにモデルを
      指定していた可能性が残っていて、どちらの証拠にもなりません。

  - after: 6
    kind: model-order
    caption: >-
      裏で動く Claude のモデルは、上から順に決まります。上の段が空なら下へ落ちる形です。
      緑が今回の記録で実際に効いた段、赤が空だった段で、赤のうち環境変数のほうは設定が
      無いことを実際に開いて確かめました。だから 43 件がいちばん下まで落ちたと言えます。
      いちばん上だけ枠が無いのは、そこを確かめていないからです。なお、環境変数の段が
      どこに入るかは版で変わります。ここは 2.1.266 の並びで、
      「CLAUDE_CODE_SUBAGENT_MODEL」は 2.1.251 より前は全部を上書きする段でした。

