# ループちゃんの一言。記事の頭と一覧の吹き出しに出ます。60 字まで。1 行で書く。
#   口調はループちゃん（「〜だよ」「〜しよう」）。TODO のままでは validate が通りません。
loopSays: モデルを変えたら、話は消えちゃうのかな。どこまで変わるのか、一緒に測ってみたよ。

# ⚠ ここが記事の値打ちの実体です。300 字以上。TODO のままでは validate が通りません。
#   書くこと: なぜそう作ったか / どこで詰まったか / いつ使わないと決めたか
#   書かないこと: ファイルの中身の引き写し（それは素材であって記事ではない）
note: |
  `/model` は、いちばん多く打っているコマンドでした。会話の記録に残っている回数を数えたら
  22 回で、`/compact` の 19 回より多かったです。それだけ打っているのに、打つときはいつも
  少し不安でした。「ここでモデルを変えたら、さっきまでの話はどうなるんだろう」が
  分からなかったからです。長く相談してきた流れが消えるのなら、切り替えるのは区切りのいい所まで
  待ちたくなります。

  なので、合言葉を隠して試しました。新しい会話で Sonnet 5 に「合言葉は バナナ3個 です」と
  伝えて、`/model` で Opus 5 に切り替えて、そのあと「合言葉は」とだけ聞きます。返ってきたのは
  「バナナ3個」でした。当てずっぽうでは当たらない言葉なので、**前半の話が渡っている印**になります。
  先に別の会話で同じことを聞くと「知らない」と返ってくるので、教えていなければ答えられない、
  というところも確かめてあります。

  ただ、画面の返事だけでは、それを書いたのがどのモデルなのか分かりません。そこで
  {{名札|会話の記録に残っている、返事を書いたモデルの名前です。Claude Code はやり取りを 1 行ずつファイルに書き残していて、その 1 行に model という項目があります。中身は claude-opus-5 のようなモデル名です。画面に出ている文字は説明のために整えられることがありますが、この名札は返事と一緒に残るので、どのモデルが答えたのかを後から確かめたいときはここを見ます。}} を
  見ました。合言葉を伝えたときの返事は `claude-sonnet-5`、合言葉を答えた返事は
  `claude-opus-5`。別のモデルでした。

  ここで「新しいモデルが覚えていた」と書きたくなったのですが、少し違いました。公式の説明を
  読むと、Claude は前のやり取りを自分で抱えているのではなく、**返事をするたびに会話の記録を
  まるごと受け取り直している**そうです。交換日記に近くて、ノートは 1 冊のまま、書き手が
  交代するだけ。新しい書き手は書く前に毎回ノートを最初から読みます。だから話がつながるわけです。
  その代わり、切り替えた直後の 1 回は {{キャッシュ|一度読んだ部分を覚えておいて、次からは安く速く読めるようにする仕組みです。長い会話を毎回最初から読み直すのは時間もお金もかかるので、前と同じところは使い回します。ただしモデルごとに別に持っているので、途中でモデルを変えると使い回せるぶんが無くなり、新しいモデルは記録を最初から読み直すことになります。}} が
  効きません。キャッシュはモデルごとに別だからです。細かく行き来するのはもったいない使い方でした。
  変えるなら、作業の区切りが良さそうです。

  試している途中で、思っていなかったものが画面に出ました。ここまで行き来していたのは
  Sonnet 5 と Opus 5 です。既定のほうは、別に進めていた開発のために Fable 5.1 に
  してあって、この実験では触っていないつもりでした。
  ところが `saved as your default for new sessions` という一行が出ます。設定ファイルを
  見に行ったら、既定のモデルが `fable` から `opus` に変わっていて、更新時刻もさっきに
  なっていました。`/model` は、その会話だけの切り替えではありませんでした。
  **設定ファイルにある「次に開く会話の既定」を、その場で書き換えます。** 試すだけのつもりが、
  既定を入れ替えていたことになります。
  ただし、その既定どおりに次の会話が始まるかは別の話でした。デスクトップの画面から開いた会話は、
  設定と違うモデルで始まっています。ここは測り切れていないので、分かっていないまま置いておきます。

  もう 1 つ気になっていたのが、{{サブエージェント|表で話している Claude が、別の仕事を任せるために裏で動かす Claude です。たとえばレビューを 4 つの見方で同時に進めたいときは、4 人ぶんが裏で動きます。話し相手とは別の設定で動くので、使うモデルもそれぞれ別に決まります。画面には結果だけが返ってくるので、どのモデルが働いたのかは記録を見ないと分かりません。}} の
  モデルです。こちらは会話の記録 458 件を数えました。呼び出すときにモデルを書かず、役の
  定義にも書いていない呼び出しが 43 件あって、**そのすべてが呼び出した側と同じモデル**でした。
  逆に、定義にモデルが書いてある役は、その通りのモデルで動きます。レビューを 4 役に分けて
  走らせた 1 回では、話し相手が Opus 5 なのに、裏では Sonnet 5 が 3 つ、Opus 5 が 1 つ、
  Fable 5.1 が 1 つ動いていました。自分の決まりごとには前から「各段にモデルを書く。書かないと
  引き継いで全部 Fable になる」と書いてあったのですが、そう書いた根拠はうろ覚えでした。
  数えてみて、ようやく裏が取れました。

  では結局どう選ぶのか。値段は
  {{トークン|文章を細かく割った、数えるための単位です。日本語だと 1 文字で 1 個か 2 個くらいになります。料金はこの個数で決まり、100 万トークンあたりいくら、という形で示されます。長い会話や大きなファイルを読ませるほど個数が増えるので、費用もその分だけ増えます。}}
  100 万個あたりで、Fable 5.1 が入力 $10 と出力 $50、Opus 5 が $5 と $25、Sonnet 5 が
  $2 と $10 でした。ただ、この表を見ても決め手にはなりませんでした。効いたのは自分の決まりに
  書いていた「任せる相手は、仕様がどこまで決まっているかで選ぶ」のほうです。決まっているなら
  Sonnet、穴が残っているなら Opus、判断そのものを相談したいなら Fable。今回の実測から足すなら、
  会話の途中で行き来しないことと、裏の役にはモデルを書いておくこと、の 2 つです。

  最後に断っておくと、これは 2026-09-16 の claude 2.1.266 で測ったものです。それと、モデルを
  またぐと前のモデルの考えている途中のメモ（thinking と呼ばれるもの）は渡らない、という記述が
  公式の資料にありました。こちらは Claude Code の中でも同じことが起きているのかを確かめて
  いないので、読んだ話として置いておきます。
