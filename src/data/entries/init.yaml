title: /init — 消えるのが怖くて打てなかった
publishedAt: '2026-09-08'
# reviewed: false = 註がまだ運営者の手で確認されていない。
# 中身は運営者の質問（2026-09-07）と /tmp/init-test での実測（2026-09-07〜08）から起こしたもの。
# 実測条件: claude 2.1.257 / --safe-mode（設定と CLAUDE.md を全部外した素の状態）/ git 管理外のフォルダ。
# reviewed: true は運営者だけが立てる。
reviewed: false

# 図。どこに・どの図を・どういう説明で、の 3 つだけを持つ（絵は src/components/Figure.astro）。
# ⚠ after が範囲外だったり kind を綴り間違えると、ビルドが止まります（黙って消えないように）。
figures:
  - after: 2
    kind: bytes
    caption: >-
      打つ前と打った後。12,617 バイトの本文は一行も消えず、上に 3,500 バイト
      足されただけだった。「消えない。けど、書き換わる」の中身がこれ。
  - after: 3
    kind: write-edit
    caption: >-
      消えなかった理由。まるごと書き直す道具（Write）を使えば元の行は残らない。
      実際に使われたのは一部だけ書き足す道具（Edit）で、だから元の本文が残った。
  - after: 3
    kind: reading-order
    caption: >-
      書く前に読んだ順番。全部で 30 手あって、CLAUDE.md を読むのは 2 手目。
      最後にようやく 3 回だけ書き足す。

note: |
  `/init`、ずっと打てませんでした。理由はひとつ。「打ったら今の
  {{CLAUDE.md|この場所のきまりを書いた紙です。Claude Code は仕事を始めるとき、まずこれを読みます。「日本語で答えて」「main に直接コミットしない」といった、毎回言うのが面倒なことを書いておくと、こちらが黙っていても守ってくれます。逆に言うと、ここに書いていないことは毎回口で言うしかありません。だから育てる価値があるし、消えると困るわけです。}}、消えるんじゃないの？」が
  分からなかったから。うちの CLAUDE.md は、そのとき 196 行・6,730 字ありました。
  ファイルの大きさでいうと 12 KB です。「main に直接コミットしない」
  「検査が緑でも信じない。先にわざと失敗させて、検査が生きていることを確かめてから」
  みたいな、何度も痛い目を見てから決めたことが 13 の見出しに分かれて入っています。
  同じものをもう一度書ける自信はありません。
  コマンド一覧の記事は山ほどあるのに、この一点を試した記事は見つからない。
  たぶんみんな怖くて試してないんですよね。

  なので、壊れてもいい場所で試しました。フォルダを
  {{git|書きかけの状態を何度でも昔に戻せる道具です。ファイルを上書きしても、記録さえ取ってあれば「昨日の形に戻す」ができます。プログラムを書く人がほぼ全員使っているのは、壊すのが怖くなくなるからです。この記事で「壊れてもいい場所」と言っているのは、この記録の外にフォルダを置いた、という意味です。戻せない代わりに、何が起きても本物には響きません。}}の外に丸ごとコピーして、設定も CLAUDE.md も
  全部外したまっさらな状態で `/init`。結果、12,617 バイトの本文は一行も消えず。
  でも 16,117 バイトに増えました。**消えない。けど、書き換わる。** これが答えでした。

  なんで消えないのか。記録を見たら分かりました。`/init` はファイルを
  {{`Write`|紙をまるごと新しく書き直す道具です。元の紙は捨てて、まっさらな紙に最初から書きます。だから前に書いてあったことは残りません。空のファイルを作るときや、中身を全部入れ替えるときに使います。もし /init がこちらを使っていたら、12 KB の CLAUDE.md は一度消えていました。}}じゃなくて、{{`Edit`|紙の一部だけを消して書き足す道具です。直したい所を探して、そこだけ差し替えます。触らなかった行はそのまま残ります。Write との違いはここだけですが、「消える／消えない」という結果はまるで逆になります。/init は 3 回これを使っていました。}}を
  3 回使ってたんです。まるごと書き直すなら元の本文は一度消える。書き足すなら残る。
  使う道具の違いが、そのまま安全な理由でした。それと、書く前にけっこう読んでます。
  だいたい 30 手。{{`ls`|その場所に何があるかを並べて見せる命令です。フォルダを開いて中を一覧するのと同じで、いちばん最初に打つ命令の定番です。/init も 1 手目でこれを打って、「ここはどういう場所か」を掴もうとしていました。}}と
  {{`find`|奥のフォルダまで潜って探す命令です。ls がその場所の一覧だけなのに対して、こちらは下の階層まで全部たどります。「設定ファイルはどこかにあるはずだ」というときに使います。/init は ls と find を組にして、まず地形を把握していました。}}で中を眺めて、2 手目で CLAUDE.md を読んで、
  部品の一覧、設定、命令の置き場、自動検査の設定、プログラム本体、と順に見て、
  他の AI 向けの設定ファイルまで探してから、ようやく書き始める。かなりの慎重派です。

  で、何が変わったか。前と後ろを見比べると、足されたのは
  {{npm script|長い命令に短いあだ名をつけて呼べるようにしたものです。たとえば毎回打つのが面倒な長い命令に「検証」という名前をつけておけば、以後はその名前を打つだけで済みます。名前と中身の対応は package.json という一覧表に書いてあります。この記事で「自分で作った命令が 5 つ載っていなかった」と言っているのは、この一覧表には実在するのに、CLAUDE.md の説明表には書き忘れていた、という意味です。}}の表に無かった行と、
  ファイル同士のつながりを描いた小見出しがひとつ、あと先頭に英語の定型文が 3 行。
  数ヶ月前の自分が書いた「なぜそうしたか」の段落には、いっさい手を出してませんでした。
  触るのは事実だけ。判断には触らない。そういう線引きに見えました。

  消えないと分かっても、書き換わるなら打つ前に
  {{commit|今の状態に名前をつけて保存することです。写真を撮って日付とひとことを添えるのに近くて、あとから「あの時点に戻す」ができます。これをしていないと、書き換えられたときに元がどうだったか誰にも分かりません。だから /init のように中身を変える命令を打つ前には、先に撮っておくのが安心なのです。}}しておくのが安心です。
  見比べて「いらないな」と思ったら戻せばいいだけ。その安心感で 2 回目も打ちました。
  増えたのは 481 バイト、重複なし、新しい章も作らず。一回きりのコマンドじゃなくて、
  何度でも打ち直せる。ひとつだけ罠があって、2 回目は「空のフォルダ」を
  「存在しないフォルダ」に書き換えてたんですけど、これは 1 回目が間違ってたわけじゃない。
  夜のうちに一時置き場の掃除でフォルダが消えてただけ。2 回の結果を比べるときは、入力が
  同じだったかを先に確かめないと、ありもしない「修正」を読み取っちゃいます。

  で、本命はここからでした。消えるかどうかより、棚卸しのほうが効いた。自分で書いた
  CLAUDE.md に、自分で作った命令が 5 つ載ってなかったんです。
  {{`harvest --dry-run`|ためしに動かすだけの指定です。本番と同じ手順を最後まで走らせて結果を見せますが、ファイルには一切書き込みません。「これを実行したら何が起きるか」を、何も壊さずに先に確認できます。危ない命令ほど、まずこれを付けて様子を見ます。}}、
  `new:entry` の {{`--slug`|記事の住所を自分で決める指定です。slug というのは URL の末尾に入る短い名前のことで、たとえば /claude/init/ の init の部分がそれにあたります。指定しなければ元の名前がそのまま使われますが、日本語の題をそのまま URL にすると読みにくくなるので、英数字の短い名前を別に付けられるようにしてあります。}}と
  {{`--title`|記事の題を、作るときに先に入れておく指定です。指定しなければ「題を書く」という仮置きの文字が入るので、あとから必ず書き直すことになります。先に入れておけば、その一手間が省けるというだけの小さな親切です。}}、
  {{`dev`|手元で見ながら直すための表示です。ファイルを保存すると画面がすぐ描き直されるので、書きながら結果を確かめられます。ただし本番と同じ形ではないので、これで大丈夫でも公開後に崩れることがあります。}}と{{`preview`|公開後とまったく同じ形に組み上げてから見せる表示です。dev が「書きながら見る」ためのものなのに対して、こちらは「出す前に最終確認する」ためのものです。dev では出なかった不具合がここで出ることがあるので、公開前には必ず通します。}}と
  {{`deploy`|組み上がったものをインターネットに出して、誰でも見られる状態にすることです。ここを押すと後戻りが利かない（見た人には見られてしまう）ので、このリポジトリでは手で打たないと動かないようにしてあります。}}の一群、
  {{`CLAUDE_HOME`|道具に「こっちの場所を見て」と外から教えるための設定です。ふだんは決められた場所の設定を読みますが、この指定を渡すと、別の場所を代わりに見ます。本物の設定を触らずに、偽の設定で動きを試したいときに使います。この記事で「棚卸しで見つかった」と言っているのは、この仕組みを自分で作ったのにCLAUDE.md に書き忘れていた、という意味です。}}。全部ちゃんと実在します。
  書いた本人が忘れてたものを、機械が読んで拾ってくれた。おまけに、このサイトの検査の
  ひとつが公開用の出来上がりを読んでいなかったことも、これで気づきました
  （別の作業で直し済み）。

  最後にひとつ断っておくと、この実測はまっさらな状態で取ったものです。普段の設定を
  全部乗せた環境だと、違う動きをするかもしれません。それと「どの CLAUDE.md が
  読まれるの？」問題は `/init` とは別の話なので、また今度書きます。
