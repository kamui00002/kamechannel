# ループちゃんの一言（記事の頭と一覧の吹き出し）。口調はループちゃん。
loopSays: 打ったら CLAUDE.md が消えちゃうのか、壊れてもいい場所でほんとに試した記録だよ。

note: |
  `/init`、ずっと打てませんでした。理由は 1 つ。「打ったら今の
  {{CLAUDE.md|この場所の決まりを書いた紙です。Claude Code は仕事を始めるとき、まずこれを読みます。「日本語で答えて」「main に直接コミットしない」といった、毎回言うのが面倒なことを書いておくと、こちらが黙っていても、だいたい守ってくれます。逆に言うと、ここに書いていないことは毎回口で言うしかありません。だから育てる価値があるし、消えると困るわけです。}}、消えるんじゃないの？」が
  分からなかったからです。うちの CLAUDE.md は、そのとき 196 行・6,730 字ありました。
  ファイルの大きさで言うと 12 KB です。「main に直接コミットしない」
  「検査が緑でも信じない。先にわざと失敗させて、検査が生きていることを確かめてから」
  みたいな、何度も痛い目を見てから決めたことが 13 の見出しに分かれて入っています。
  同じものをもう一度書ける自信はありません。
  コマンド一覧の記事は山ほどあるのに、この一点を試した記事は見つかりません。
  たぶんみんな怖くて試してないんですよね。

  なので、壊れてもいい場所で試しました。フォルダを
  {{git|書きかけの状態を何度でも昔に戻せる道具です。ファイルを上書きしても、記録さえ取ってあれば「昨日の形に戻す」ができます。プログラムを書く人がほぼ全員使っているのは、壊すのが怖くなくなるからです。この記事で「壊れてもいい場所」と言っているのは、この記録の外にフォルダを置いた、という意味です。戻せない代わりに、何が起きても本物には響きません。}} の外に丸ごとコピーして、設定も CLAUDE.md も
  全部外したまっさらな状態で `/init`。結果、12,617 バイトの本文は一行も消えず。
  でも 16,117 バイトに増えました。**消えない。けど、書き換わる。** これが答えでした。

  なんで消えないのか。記録を見たら分かりました。`/init` はファイルを
  {{`Write`|紙をまるごと新しく書き直す道具です。元の紙は捨てて、まっさらな紙に最初から書きます。だから前に書いてあったことは残りません。空のファイルを作るときや、中身を全部入れ替えるときに使います。もし /init がこちらを使っていたら、12 KB の CLAUDE.md は一度消えていました。}} じゃなくて、{{`Edit`|紙の一部だけを消して書き足す道具です。直したい所を探して、そこだけ差し替えます。触らなかった行はそのまま残ります。Write との違いはここだけですが、「消える／消えない」という結果はまるで逆になります。/init は 3 回これを使っていました。}} を
  3 回使ってたんです。まるごと書き直すなら元の本文は一度消えます。書き足すなら残ります。
  使う道具の違いが、そのまま安全な理由でした。それと、書く前にけっこう読んでます。
  だいたい 30 手。{{`ls`|その場所に何があるかを並べて見せる命令です。フォルダを開いて中を一覧するのと同じで、いちばん最初に打つ命令の定番です。/init も 1 手目でこれを打って、「ここはどういう場所か」を掴もうとしていました。}} と
  {{`find`|奥のフォルダまで潜って探す命令です。ls がその場所の一覧だけなのに対して、こちらは下の階層まで全部たどります。「設定ファイルはどこかにあるはずだ」というときに使います。/init は ls と find を組にして、まず地形を把握していました。}} で中を眺めて、2 手目で CLAUDE.md を読んで、
  部品の一覧、設定、命令の置き場、自動検査の設定、プログラム本体、と順に見て、
  他の AI 向けの設定ファイルまで探してから、ようやく書き始めます。かなりの慎重派です。

  で、何が変わったか。打つ前と後を見比べると、足されたのは
  {{npm script|長い命令に短いあだ名をつけて呼べるようにしたものです。たとえば毎回打つのが面倒な長い命令に「検証」という名前をつけておけば、以後はその名前を打つだけで済みます。名前と中身の対応は package.json という一覧表に書いてあります。この記事で「自分で作った命令が 5 つ載ってなかった」と言っているのは、この一覧表には実在するのに、CLAUDE.md の説明表には書き忘れていた、という意味です。}} の表に無かった行と、
  ファイル同士のつながりを描いた小見出しが 1 つ、あと先頭に英語の定型文が 3 行。
  数か月前の自分が書いた「なぜそうしたか」の段落には、いっさい手を出してませんでした。
  触るのは事実だけ。判断には触らない。そういう線引きに見えました。

  消えないと分かっても、書き換わるなら打つ前に
  {{commit|今の状態に名前をつけて保存することです。写真を撮って日付とひとことを添えるのに近くて、あとから「あの時点に戻す」ができます。これをしていないと、書き換えられたときに元がどうだったか誰にも分かりません。だから /init のように中身を変える命令を打つ前には、先に撮っておくのが安心なのです。}} しておくのが安心です。
  見比べて「いらないな」と思ったら戻せばいいだけです。その安心感で 2 回目も打ちました。
  増えたのは 481 バイト、重複なし、新しい章も作らず。一回きりのコマンドじゃなくて、
  何度でも打ち直せます。1 つだけ罠があって、2 回目は「空のフォルダ」を
  「存在しないフォルダ」に書き換えてたんですけど、これは 1 回目が間違ってたわけじゃありません。
  夜のうちに一時置き場の掃除でフォルダが消えてただけです。2 回の結果を比べるときは、入力が
  同じだったかを先に確かめないと、ありもしない「修正」を読み取っちゃいます。

  で、本命はここからでした。消えるかどうかより、棚卸しのほうが効きました。自分で書いた
  CLAUDE.md に、自分で作った命令が 5 つ載ってなかったんです。{{`harvest --dry-run`|ためしに動かすだけの指定です。本番と同じ手順を最後まで走らせて結果を見せますが、ファイルには一切書き込みません。「これを実行したら何が起きるか」を、何も壊さずに先に確認できます。危ない命令ほど、まずこれを付けて様子を見ます。}}、`new:entry` の {{`--slug`|記事の住所を自分で決める指定です。slug というのは URL の末尾に入る短い名前のことで、たとえば /claude/init/ の init の部分がそれにあたります。指定しなければ元の名前がそのまま使われますが、日本語の題をそのまま URL にすると読みにくくなるので、英数字の短い名前を別に付けられるようにしてあります。}} と
  {{`--title`|記事の題を、作るときに先に入れておく指定です。指定しなければ、題の欄に仮置きの文字が入るので、あとから必ず書き直すことになります。先に入れておけば、その一手間が省けるというだけの小さな親切です。}}、{{`dev`|手元で見ながら直すための表示です。ファイルを保存すると画面がすぐ描き直されるので、書きながら結果を確かめられます。ただし本番と同じ形ではないので、これで大丈夫でも公開後に崩れることがあります。}} と {{`preview`|公開後とまったく同じ形に組み上げてから見せる表示です。dev が「書きながら見る」ためのものなのに対して、こちらは「出す前に最終確認する」ためのものです。dev では出なかった不具合がここで出ることがあるので、公開前には必ず通します。}} と
  {{`deploy`|組み上がったものをインターネットに出して、誰でも見られる状態にすることです。ここを押すと後戻りが利かない（見た人には見られてしまう）ので、このリポジトリでは手で打たないと動かないようにしてあります。}} の一群、{{`CLAUDE_HOME`|道具に「こっちの場所を見て」と外から教えるための設定です。ふだんは決められた場所の設定を読みますが、この指定を渡すと、別の場所を代わりに見ます。本物の設定を触らずに、偽の設定で動きを試したいときに使います。この記事でこれを挙げているのは、この仕組みを自分で作ったのに CLAUDE.md に書き忘れていた、という意味です。}}。全部ちゃんと実在します。
  書いた本人が忘れてたものを、機械が読んで拾ってくれました。おまけに、このサイトの検査の
  1 つが公開用の出来上がりを読んでいなかったことにも、これで気づきました
  （別の作業で直し済み）。

  ……と、ここまでが自分で測った結果です。書き終えたあとで、**公式のドキュメントも
  読んで突き合わせました**（日本語版の「プロジェクト CLAUDE.md を設定する」という節
  です）。そうしたら、いちばん怖かったところに、**一行だけ答えが書いてありました。**
  「CLAUDE.md が既に存在する場合、`/init` は上書きするのではなく改善を提案します」。
  ……先に読んでおけばよかった、と一瞬思いました。ただ、この一行だけでは
  **12 KB の本文が一行も消えないところまでは分かりません。**「改善を提案する」と
  「元の行が 1 つも消えない」は、同じことではないからです。実際に一行も消えなかったことと、
  その理由が `Edit` を 3 回使っていたからだということは、記録を開かないと出てきませんでした。
  **公式が書いているのは「何をするか」まで**で、「どうやるか」は書いていないんです。

  もう 1 つ、こちらは見つけて嬉しかったほうです。上で「他の AI 向けの設定ファイルまで探してから、ようやく書き始めます。かなりの慎重派です」と書きました。あれは**慎重なのではなく、
  そういう仕組み**でした。ここでいう他の AI というのは
  {{Cursor|Claude Code と同じように、AI に手伝ってもらいながらコードを書く道具です。GitHub Copilot も同じ仲間で、どちらも「この決まりごとを守って」と書いておくファイルを持っています。置き場所と名前が違うだけで、やろうとしていることは CLAUDE.md と同じです。}}
  や GitHub Copilot のことです。同じページの「AGENTS.md」という節にこうあります。
  「`/init` を実行すると、`.cursor/rules/` または `.cursorrules` の Cursor ルール、
  および `.github/copilot-instructions.md` の Copilot ルールを読み込み、関連する
  部分を生成された `CLAUDE.md` に組み込みます」。**別の道具に書いておいた
  決まりごとを、引っ越しさせてくれる**わけです。記録の中で「なんでこんなものまで
  見てるんだろう」と思って眺めていた動きに、ちゃんと名前がついていました。

  最後に 1 つ断っておくと、この実測はまっさらな状態で取ったものです。普段の設定を
  全部乗せた環境だと、違う動きをするかもしれません。それと「どの CLAUDE.md が
  読まれるの？」問題は `/init` とは別の話なので、別の記事にしました。下の「あわせて読む」から読めます。
