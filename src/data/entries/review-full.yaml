title: /review-full — 指摘は集まった。読めなかった
publishedAt: '2026-09-07'
# reviewed: false = 註がまだ運営者の手で確認されていない。
# 中身は運営者への聞き取り（2026-09-07）から起こしたもの。公開前に一度読むこと。
reviewed: false
note: |
  レビュアーを 4 人（simplifier / general / codex / project-rules）並列で走らせると、
  指摘は確かに集まる。でも読めなかった。

  困ったのは件数そのものではない。**どれが重要か分からない**ことだった。
  直さないと壊れる指摘と、直さなくても困らない指摘が、同じ顔をして同じ長さで並ぶ。
  結局こちらが全部読んで仕分けることになる。それでは人を 4 人に増やした意味がない。
  むしろ仕分けの手間が 4 倍になっただけになる。レビューの人数を増やして解けるのは
  「見落とし」であって、「読めなさ」の方はかえって悪くなる。

  だから 4 人の後ろに filter-validity-judge を置いた。集まった指摘をそのまま出さず、
  「これは本当に直す価値があるか」で一度落とす。捏造・許容範囲・存在しないコーナー
  ケース・権威バイアスを棄却の観点にしてある。落ちる割合はおおよそ 8 割。5 件出たら
  4 件は捨てる勘定になる。**捨てる方が主で、残す方が例外**という比率が、この道具の
  性格をよく表していると思う。

  使い分けはしていない。commit や PR の前には常に回している。4 並列は軽くないので
  場面を選ぶ設計にもできたが、「小さい変更だから飛ばす」という基準は今のところ
  設けていない。
