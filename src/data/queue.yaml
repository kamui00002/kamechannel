  - id: review-orchestrator
    kind: skill
    path: skills/review-orchestrator/SKILL.md
    description: >-
      Tomada-style **4-stage fixed-role** parallel code review with validity filtering. Use this
      when the user is about to commit/open a PR and says レビューして / review this / PRレビューして / コードレビュー
      / コミット前に見て / 実装後レビュー. Runs 4 **fixed** reviewer sub-agents in parallel (simplifier + general +
      codex + project-rules), then a validity-judge filter that drops ~80% (fabricated /
      acceptable-range / non-existent-corner-case / authority-bias), then presents an integrated
      report. Use this as the **default implementation-after review path** for normal feature/fix
      commits. For dynamic-persona generation (2-4 reviewer personas adapted to the diff) use the
      `multi-agent-reviewer` skill instead.
